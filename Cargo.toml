[workspace]
resolver = "3"
members = ["tetris", "core_tetris", "render_tetris", "input_manager", "ui_tetris"]

[workspace.dependencies]
piston_window = "0.132.0"
piston = { version = "1.0.0", features = ["async"] }
piston2d-graphics = { version = "0.45.0", features = ["glyph_cache_rusttype"] }
piston2d-opengl_graphics = "0.89.0"
rand = "0.10.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_cbor = "0.11.2"
rand_pcg = "0.10.0"
local-ip-address = "0.6.3"
arboard = "3.4.1"
include_assets = { git = "https://github.com/william-gooch/include_assets" }
simple-mermaid = "0.2.0"
rstest = "0.26.1"
pistoncore-glfw_window = { version = "0.82.0" }
serde_json = "1.0"
